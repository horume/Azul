<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map of Tapachula Routes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        /* Styles matching Tuxtla design */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .app {
            padding: 20px;
        }
        .map {
            height: 500px;
        }
        .search-container {
            margin-bottom: 12px;
        }
        .route-panel {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .route-panel h3 {
            margin: 0 0 10px;
        }
        #route-list {
            max-height: 220px;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .route-item-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 6px;
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }
        #route-info {
            margin-top: 8px;
            min-height: 20px;
        }
        .toggle-routes-btn {
            display: none;
        }
        .route-panel.collapsed #route-list {
            display: none;
        }
        .route-panel.collapsed {
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .app {
                padding: 10px;
            }
            .toggle-routes-btn {
                display: inline-block;
                width: 100%;
                margin-bottom: 8px;
                padding: 10px;
                border: 0;
                border-radius: 8px;
                background: #3d6fb6;
                color: #fff;
                font-weight: 600;
            }
            .map {
                height: 75vh;
            }
            .route-panel {
                position: fixed;
                left: 10px;
                right: 10px;
                bottom: 10px;
                z-index: 1000;
                max-height: 70vh;
                overflow-y: auto;
                margin-bottom: 0;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            }
            .route-panel.collapsed {
                height: 25vh;
                max-height: 25vh;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="search-container">
            <input type="text" id="route-search" placeholder="Search by route number..." />
        </div>
        <button id="toggle-routes" class="toggle-routes-btn" type="button">Ver rutas</button>
        <div id="route-panel" class="route-panel">
            <h3>Rutas</h3>
            <ul id="route-list"></ul>
            <div id="route-info"></div>
        </div>
        <div id="map" class="map"></div>
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([14.8333, -92.4167], 13); // Centered on Tapachula

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        const routeList = document.getElementById('route-list');
        const routeInfo = document.getElementById('route-info');
        const routePanel = document.getElementById('route-panel');
        const toggleRoutesBtn = document.getElementById('toggle-routes');

        const routes = [
            { number: 'ruta_01tapd', lat: 14.827, lng: -92.416, details: 'Details about ruta_01tapd' },
            { number: 'ruta_02tapd', lat: 14.828, lng: -92.417, details: 'Details about ruta_02tapd' },
            // Add additional routes up to ruta_017tapreg
            { number: 'ruta_017tapreg', lat: 14.829, lng: -92.418, details: 'Details about ruta_017tapreg' },
        ];

        function isMobileViewport() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function refreshMapSize() {
            setTimeout(function() {
                map.invalidateSize();
            }, 200);
        }

        function setPanelCollapsed(collapsed) {
            if (!isMobileViewport()) {
                return;
            }
            routePanel.classList.toggle('collapsed', collapsed);
            toggleRoutesBtn.innerText = collapsed ? 'Ver rutas' : 'Ocultar rutas';
            refreshMapSize();
        }

        function selectRoute(route, marker) {
            routeInfo.innerText = route.details;
            map.setView([route.lat, route.lng], 15);
            if (marker) {
                marker.openPopup();
            }
            setPanelCollapsed(true);
        }

        toggleRoutesBtn.addEventListener('click', function() {
            const shouldCollapse = !routePanel.classList.contains('collapsed');
            setPanelCollapsed(shouldCollapse);
        });

        const routeButtons = [];

        routes.forEach(route => {
            var marker = L.marker([route.lat, route.lng]).addTo(map);
            marker.bindPopup(route.details);

            const listItem = document.createElement('li');
            const routeButton = document.createElement('button');
            routeButton.type = 'button';
            routeButton.className = 'route-item-btn';
            routeButton.innerText = route.number;
            routeButton.addEventListener('click', function() {
                selectRoute(route, marker);
            });
            listItem.appendChild(routeButton);
            routeList.appendChild(listItem);
            routeButtons.push({ route, button: routeButton, item: listItem });

            marker.on('click', function() {
                selectRoute(route, marker);
            });
        });

        document.getElementById('route-search').addEventListener('input', function(e) {
            let searchValue = e.target.value.toLowerCase();
            let firstMatch = null;

            routeButtons.forEach(function(entry) {
                const isMatch = entry.route.number.toLowerCase().includes(searchValue);
                entry.item.style.display = isMatch ? '' : 'none';
                if (!firstMatch && isMatch) {
                    firstMatch = entry;
                }
            });

            if (firstMatch) {
                map.setView([firstMatch.route.lat, firstMatch.route.lng], 15);
            }
        });

        window.addEventListener('resize', function() {
            if (!isMobileViewport()) {
                routePanel.classList.remove('collapsed');
                toggleRoutesBtn.innerText = 'Ver rutas';
            }
        });
    </script>
</body>
</html>
