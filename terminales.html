  <style>
    :root{
      --bg:#f3f6fb; --surface:#fff; --text:#1a2433; --muted:#5f6c80;
      --primary:#0A2540; --accent:#00A86B; --border:#dfe6ef;
      --shadow:0 8px 24px rgba(10,37,64,.08); --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#0A2540,#133b66);color:#fff;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
    .header-wrap,.buscador,.meta,.grid,.empty{max-width:1100px;margin:0 auto}
    h1{margin:0;font-size:1.5rem}.subtitle{margin:.3rem 0 0;opacity:.9}
    .buscador{padding:14px}
    .search-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
    input{width:100%;border:none;outline:none;font-size:16px;background:transparent;color:var(--text)}
    .meta{padding:0 16px 10px;color:var(--muted);font-size:.92rem}
    .grid{padding:0 14px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
    .card-header{padding:14px 14px 8px;border-bottom:1px solid #eef3f8}
    .card h2{margin:0;font-size:1.08rem;color:#0e2a49}
    .card-body{padding:12px 14px 14px}
    .row{margin:0 0 8px;line-height:1.35;font-size:.95rem}
    .label{font-weight:700;color:#22344d}
    .tags{margin:8px 0 10px;display:flex;flex-wrap:wrap;gap:6px}
    .tag{display:inline-block;background:#eef3f8;color:#324760;border:1px solid #dde7f2;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600}
    iframe{width:100%;height:180px;border:none;border-top:1px solid #eef3f8;border-bottom:1px solid #eef3f8}
    .actions{padding:12px 14px 14px;margin-top:auto}
    .btn{display:block;width:100%;background:var(--accent);color:#fff;text-align:center;padding:11px 12px;text-decoration:none;border-radius:10px;font-weight:700}
    .hidden{display:none!important}
    .empty{padding:0 16px 24px;color:var(--muted);display:none}
    @media (max-width:640px){.grid{grid-template-columns:1fr}iframe{height:200px}}
  </style>
</head>

    function telefonoHTML(item){
      if(!item.telefono) return "No disponible";
      const pretty = item.telefono.replace(/(\d{3})(\d{3})(\d{4})/, "$1 $2 $3");
      return `<a href="tel:${item.telefono}">📞 ${pretty}</a> ${item.telefonoNota ? item.telefonoNota : ""}`;
    }

    function buildCard(item){
      const searchText = [
        item.nombre, item.destino, item.ruta, item.direccion,
        (item.servicios || []).join(" "), (item.tags || []).join(" ")
      ].join(" ").toLowerCase();

      const tags = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
      const servicios = (item.servicios || []).join(", ");
      const mapsEmbed = `https://www.google.com/maps?q=${item.lat},${item.lng}&output=embed`;
      const mapsLink = `https://www.google.com/maps?q=${item.lat},${item.lng}`;

      return `
        <article class="card" data-search="${searchText}">
          <div class="card-header"><h2>${item.nombre}</h2></div>
          <div class="card-body">
            <p class="row"><span class="label">Destino:</span> ${item.destino || "Por confirmar"}</p>
            <p class="row"><span class="label">Ruta:</span> ${item.ruta || "Por confirmar"}</p>
            <p class="row"><span class="label">Dirección:</span> ${item.direccion || "Por confirmar"}</p>
            <p class="row"><span class="label">Horario:</span> ${item.horario || "Por confirmar"}</p>
            <p class="row"><span class="label">Costo aprox:</span> ${item.costo || "Por confirmar"}</p>
            <p class="row"><span class="label">Tel:</span> ${telefonoHTML(item)}</p>
            <p class="row"><span class="label">Servicios:</span> ${servicios || "Por confirmar"}</p>
            <div class="tags">${tags}</div>
          </div>
          <iframe loading="lazy" src="${mapsEmbed}"></iframe>
          <div class="actions">
            <a class="btn" href="${mapsLink}" target="_blank" rel="noopener">📍 Cómo llegar</a>
          </div>
        </article>
      `;
    }

    function renderTerminales(data){
      const cont = document.getElementById("contenedorCards");
      cont.innerHTML = data.map(buildCard).join("");
      actualizarContador();
    }

    function actualizarContador(){
      const visibles = [...document.querySelectorAll(".card")].filter(c => !c.classList.contains("hidden")).length;
      document.getElementById("contador").textContent = `Mostrando ${visibles} terminal${visibles===1?"":"es"}`;
      document.getElementById("sinResultados").style.display = visibles ? "none" : "block";
    }

    function filtrar(){
      const q = document.getElementById("busqueda").value.trim().toLowerCase();
      document.querySelectorAll(".card").forEach(card=>{
        const txt = card.getAttribute("data-search") || "";
        card.classList.toggle("hidden", !txt.includes(q));
      });
      actualizarContador();
    }

    renderTerminales(TERMINALES);
